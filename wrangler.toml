name = "koreader-sync"
main = "src/index.ts"
compatibility_date = "2026-06-16"

[placement]
mode = "smart"

[vars]
SESSION_TTL_HOURS = "168"
# SESSION_RENEW_WINDOW_HOURS defaults to half of SESSION_TTL_HOURS. Set an explicit value to
# renew only near expiry (fewer DB writes), or "0" to disable sliding-session renewal.
# SESSION_RENEW_WINDOW_HOURS = "84"

[[d1_databases]]
binding = "DB"
database_name = "koreader-sync-db"
database_id = "acecef52-2a94-4d50-a6eb-6237822f6ac7"
migrations_dir = "migrations"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
